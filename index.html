<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>theRoadMan — The Road Provides</title>

<link
  rel="icon"
  type="image/png"
  href="desert_roadman_badge.png"
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
  --black:#000;
  --white:#f0f0ed;
  --orange:#ff5a1f;

  --display:"Anton",sans-serif;
  --mono:"IBM Plex Mono",monospace;
}


/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;

  background:var(--black);
}

body{
  overflow:hidden;

  background:var(--black);
  color:var(--white);

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =====================================================
   COVER
===================================================== */

.cover{
  position:relative;

  width:100%;
  height:100vh;
  height:100svh;

  min-height:500px;

  background:#000;

  overflow:hidden;
}


/* =====================================================
   ARTWORK
===================================================== */

.artwork{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:#000;
}

.artwork img{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center center;

  opacity:.97;

  filter:
    saturate(.88)
    contrast(1.04);

  user-select:none;

  -webkit-user-select:none;
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
}


/* =====================================================
   CINEMATIC VIGNETTE
===================================================== */

.artwork::after{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 42%,
      rgba(0,0,0,.16) 72%,
      rgba(0,0,0,.38) 100%
    );

  z-index:2;
}


/* =====================================================
   SUBTLE TOP DARKNESS
===================================================== */

.cover::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:22%;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.28),
      transparent
    );

  pointer-events:none;

  z-index:3;
}


/* =====================================================
   ORANGE BRAND DETAIL
===================================================== */

.accent{
  position:absolute;

  right:34px;
  top:30px;

  width:22px;
  height:2px;

  background:var(--orange);

  z-index:11;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{
  position:absolute;

  left:34px;
  right:34px;
  bottom:30px;

  z-index:10;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  pointer-events:none;
}


/* =====================================================
   SIGNATURE
===================================================== */

.signature{
  display:flex;
  flex-direction:column;

  gap:9px;
}

.signature-main{
  font-family:var(--display);

  font-size:34px;
  font-weight:400;

  line-height:.9;

  letter-spacing:.01em;

  text-transform:uppercase;

  color:var(--white);
}

.signature-sub{
  font-family:var(--mono);

  font-size:10px;

  letter-spacing:.20em;

  color:rgba(240,240,237,.55);

  text-transform:uppercase;
}


/* =====================================================
   ENTER
===================================================== */

.enter{
  pointer-events:auto;

  display:flex;
  align-items:center;

  gap:16px;

  padding-bottom:3px;

  font-family:var(--mono);

  font-size:13px;

  letter-spacing:.18em;

  color:rgba(240,240,237,.95);

  transition:
    color .25s ease,
    gap .25s ease;
}

.arrow{
  display:inline-block;

  color:var(--orange);

  font-size:21px;
  line-height:1;

  transition:
    transform .25s ease;
}

.enter:hover{
  color:var(--orange);

  gap:21px;
}

.enter:hover .arrow{
  transform:translateX(5px);
}

.enter:active{
  transform:translateY(1px);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .cover{
    min-height:100svh;
  }

  .artwork img{
    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center center;
  }

  .bottom{
    left:20px;
    right:20px;
    bottom:20px;

    align-items:flex-end;
  }

  .signature{
    gap:8px;
  }

  .signature-main{
    font-size:27px;
  }

  .signature-sub{
    font-size:8px;
    letter-spacing:.16em;
  }

  .enter{
    font-size:10px;

    gap:11px;

    letter-spacing:.14em;
  }

  .arrow{
    font-size:18px;
  }

  .accent{
    right:20px;
    top:20px;

    width:18px;
    height:1px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:420px){

  .bottom{
    left:18px;
    right:18px;
    bottom:18px;
  }

  .signature{
    gap:7px;
  }

  .signature-main{
    font-size:23px;
  }

  .signature-sub{
    font-size:7px;
    letter-spacing:.13em;
  }

  .enter{
    font-size:8px;

    gap:8px;

    letter-spacing:.12em;
  }

  .arrow{
    font-size:16px;
  }

  .accent{
    right:18px;
    top:18px;
  }

}


/* =====================================================
   SHORT DESKTOP
===================================================== */

@media(min-width:701px) and (max-height:650px){

  .bottom{
    left:25px;
    right:25px;
    bottom:20px;
  }

  .signature-main{
    font-size:29px;
  }

  .signature-sub{
    font-size:9px;
  }

  .enter{
    font-size:11px;
  }

  .arrow{
    font-size:19px;
  }

  .accent{
    right:25px;
    top:25px;
  }

}


/* =====================================================
   IMAGE PROTECTION
===================================================== */

img{
  -webkit-user-drag:none;
}

</style>

</head>


<body>

<main class="cover">


  <!-- =================================================
       MAIN BRAND ARTWORK
  ================================================== -->

  <section class="artwork">

    <img
      src="roadman-scenes/scene4.png"
      alt="theRoadMan — The Road Provides"
      draggable="false"
      oncontextmenu="return false"
    >

  </section>


  <!-- =================================================
       ORANGE BRAND DETAIL
  ================================================== -->

  <div class="accent"></div>


  <!-- =================================================
       COVER FOOTER
  ================================================== -->

  <footer class="bottom">


    <div class="signature">

      <div class="signature-main">
        theRoadMan
      </div>

      <div class="signature-sub">
        One character. Many roads.
      </div>

    </div>


    <!--
      IMPORTANT:
      The official flow starts here.

      index.html
        ↓
      links.html
        ↓
      claim.html
    -->

    <a
      href="./links.html"
      class="enter"
      aria-label="Enter the Road"
    >

      ENTER THE ROAD

      <span class="arrow">
        →
      </span>

    </a>


  </footer>


</main>


<script>

/* =====================================================
   BASIC IMAGE PROTECTION
===================================================== */

const artwork = document.querySelector(".artwork img");

if(artwork){

  artwork.addEventListener(
    "contextmenu",
    function(event){
      event.preventDefault();
    }
  );

  artwork.addEventListener(
    "dragstart",
    function(event){
      event.preventDefault();
    }
  );

  artwork.addEventListener(
    "selectstart",
    function(event){
      event.preventDefault();
    }
  );

}

</script>

</body>
</html>
