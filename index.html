<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>THE ROAD PROVIDES</title>

<link rel="icon" type="image/png" href="desert_roadman_badge.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --bg:#000;
  --orange:#ff5a1f;
  --orange2:#ff6a2a;
  --ink:#f1f1f1;
  --dim:#777;
  --mono:'IBM Plex Mono',monospace;
  --display:'Anton',sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  min-height:100svh;
  overflow:hidden;
  color:var(--ink);
  font-family:var(--mono);
}

.page{
  position:relative;
  width:100%;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;
}

/* =====================================================
   BACKGROUND
===================================================== */

.page::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;

  background:
    radial-gradient(
      ellipse 70% 65% at 50% 45%,
      rgba(255,90,31,.09),
      transparent 70%
    );

  pointer-events:none;
}

.page::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;

  background:
    repeating-linear-gradient(
      115deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 48px
    );

  opacity:.35;
  pointer-events:none;
}

/* =====================================================
   BRAND
===================================================== */

.brand{
  position:relative;
  z-index:5;

  width:min(760px,94vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logo{
  width:min(760px,94vw);
  max-height:72svh;
  object-fit:contain;
  object-position:center;

  display:block;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
  -webkit-touch-callout:none;

  filter:
    drop-shadow(0 18px 35px rgba(0,0,0,.85))
    drop-shadow(0 0 28px rgba(255,90,31,.07));
}

/* =====================================================
   ENTER
===================================================== */

.enter{
  position:relative;
  z-index:10;

  margin-top:clamp(12px,3svh,24px);

  min-width:min(250px,72vw);

  padding:14px 28px;

  border:1px solid var(--orange);
  border-radius:999px;

  background:var(--orange);
  color:#fff;

  font:
    600 12px var(--mono);

  letter-spacing:.08em;
  text-transform:uppercase;

  text-decoration:none;
  text-align:center;

  box-shadow:
    0 0 0 rgba(255,90,31,0);

  transition:
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.enter:hover{
  background:var(--orange2);

  box-shadow:
    0 0 25px rgba(255,90,31,.25);

  transform:translateY(-1px);
}

.enter:active{
  transform:translateY(1px);
}

/* =====================================================
   LOWER LINKS
===================================================== */

.links{
  position:relative;
  z-index:10;

  display:flex;
  align-items:center;
  gap:14px;

  margin-top:12px;
}

.links a{
  color:var(--dim);
  text-decoration:none;

  font:
    9px var(--mono);

  letter-spacing:.08em;
  text-transform:uppercase;

  transition:
    color .2s ease;
}

.links a:hover{
  color:var(--orange);
}

.separator{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#444;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
  position:absolute;
  z-index:10;

  left:0;
  right:0;
  bottom:
    max(14px, env(safe-area-inset-bottom));

  text-align:center;

  font:
    8px var(--mono);

  letter-spacing:.08em;
  color:#444;

  pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .brand{
    width:96vw;
  }

  .logo{
    width:96vw;
    max-height:68svh;
  }

  .enter{
    margin-top:10px;
    padding:13px 25px;
    min-width:220px;
  }

  .links{
    margin-top:10px;
  }

}

/* =====================================================
   SHORT SCREENS
===================================================== */

@media(max-height:650px){

  .logo{
    max-height:62svh;
  }

  .enter{
    margin-top:8px;
    padding:11px 23px;
  }

  .links{
    margin-top:7px;
  }

}

/* =====================================================
   IMAGE PROTECTION
===================================================== */

img{
  -webkit-user-drag:none;
}

</style>
</head>

<body>

<main class="page">

  <div class="brand">

    <img
      class="logo"
      src="desert_roadman_badge.png"
      alt="THE ROAD PROVIDES — theRoadMan"
      draggable="false"
      oncontextmenu="return false"
    >

    <a
      class="enter"
      href="claim.html"
    >
      Enter the Road
    </a>

    <div class="links">

      <a
        href="https://x.com/theroadprovides"
        target="_blank"
        rel="noopener noreferrer"
      >
        X
      </a>

      <span class="separator"></span>

      <a
        href="links.html"
      >
        Links
      </a>

    </div>

  </div>

  <div class="footer">
    THE ROAD PROVIDES
  </div>

</main>

<script>

const logo = document.querySelector(".logo");

if(logo){

  logo.addEventListener(
    "contextmenu",
    function(event){
      event.preventDefault();
    }
  );

  logo.addEventListener(
    "dragstart",
    function(event){
      event.preventDefault();
    }
  );

  logo.addEventListener(
    "selectstart",
    function(event){
      event.preventDefault();
    }
  );

}

</script>

</body>
</html>
