<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>THE ROAD PROVIDES — The First 100</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#000;
  --cell:#090909;
  --border:#2f3336;
  --cellborder:#1a1a1a;
  --ink:#e7e9ea;
  --dim:#71767b;

  --orange:#ff5a1f;
  --orange2:#ff6a2a;

  --display:'Anton',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--ink);
  font-family:var(--body)
}

.wrap{
  height:100svh;
  width:min(1100px,100%);
  margin:auto;
  padding:0 16px;
  display:flex;
  flex-direction:column
}

/* =========================
   HEADER
========================= */

.hero{
  flex:0 0 auto;

  border-bottom:1px solid var(--border);

  padding:13px 4px 11px;

  display:flex;
  align-items:flex-end;

  gap:18px
}

.hero h1{
  font:clamp(24px,4vw,36px)/1 var(--display);
  white-space:nowrap
}

.desc{
  font-size:11.5px;
  color:var(--dim);
  line-height:1.35;
  max-width:460px
}

.progress{
  margin-left:auto;
  white-space:nowrap;
  font:10.5px var(--mono);
  color:var(--dim)
}

.progress span{
  color:var(--orange)
}

/* =========================
   GRID
========================= */

.grid-area{
  flex:1;
  min-height:0;
  padding:7px 0
}

.grid{
  height:100%;

  display:grid;

  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);

  gap:3px
}

.tile{
  position:relative;

  background:var(--cell);

  border:1px solid var(--cellborder);

  border-radius:4px;

  overflow:visible;

  z-index:1;

  transform:translateZ(0)
}

.tile:hover{
  z-index:100
}

/* =========================
   IMAGE / ZOOM
========================= */

.content{
  position:absolute;
  inset:0;

  border-radius:4px;

  background:#090909 center/cover no-repeat;

  border:1px solid transparent;

  transform-origin:center center;

  transform:scale(1) translateZ(0);

  transition:
    transform .18s cubic-bezier(.16,1,.3,1),
    border-color .16s ease,
    box-shadow .20s ease,
    filter .16s ease;

  filter:brightness(.9);

  will-change:transform;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  pointer-events:none;
}

.tile:hover .content{
  transform:scale(2.35) translateZ(0);

  border-color:rgba(255,90,31,.88);

  box-shadow:
    0 13px 30px rgba(0,0,0,.58),
    0 0 0 1px rgba(255,90,31,.35),
    0 0 20px rgba(255,90,31,.22);

  filter:brightness(1.07);
}

.tile:not(:hover) .content{
  transition:
    transform .27s cubic-bezier(.22,1,.36,1),
    border-color .20s ease,
    box-shadow .25s ease,
    filter .20s ease;
}

/* =========================
   NUMBER
========================= */

.num{
  position:absolute;
  z-index:3;

  bottom:2px;
  left:3px;

  font:6px var(--mono);

  color:rgba(255,255,255,.72);

  background:rgba(0,0,0,.55);

  padding:1px 3px;

  border-radius:3px;

  pointer-events:none;

  transition:opacity .16s ease
}

.tile:hover .num{
  opacity:0
}

/* =========================
   EMPTY
========================= */

.empty{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:#333;

  font:7px var(--mono);

  pointer-events:none
}

/* =========================
   FOOTER
========================= */

.footer{
  flex:0 0 auto;

  border-top:1px solid var(--border);

  padding:10px 4px 12px;

  display:flex;
  align-items:center;

  gap:15px;

  position:relative;
}

.footer::before{
  content:"";

  position:absolute;

  top:-1px;
  left:0;

  width:72px;
  height:1px;

  background:var(--orange);

  box-shadow:
    0 0 8px rgba(255,90,31,.28);
}

.brand{
  font:14px var(--display);

  white-space:nowrap;

  letter-spacing:.1px
}

.brand span{
  display:block;

  font:10px var(--body);

  color:var(--dim);

  margin-top:1px
}

.actions{
  display:flex;

  gap:8px;

  margin-left:auto
}

.actions a{
  text-decoration:none;

  border-radius:999px;

  padding:8px 15px;

  font-size:11px;

  font-weight:700;

  white-space:nowrap;

  transition:
    background .16s ease,
    border-color .16s ease,
    color .16s ease,
    box-shadow .16s ease,
    transform .16s ease;
}

.actions a:hover{
  transform:translateY(-1px)
}

.x{
  border:1px solid var(--border);

  color:var(--ink);

  background:rgba(255,255,255,.015);
}

.x:hover{
  border-color:rgba(255,90,31,.55);

  color:var(--orange);

  background:rgba(255,90,31,.05);

  box-shadow:
    0 0 12px rgba(255,90,31,.08);
}

.buy{
  background:var(--orange);

  color:#fff;

  border:1px solid var(--orange);

  box-shadow:
    0 0 12px rgba(255,90,31,.10);
}

.buy:hover{
  background:var(--orange2);

  border-color:var(--orange2);

  box-shadow:
    0 0 18px rgba(255,90,31,.22);
}

/* =========================
   MOBILE
========================= */

@media(max-width:640px){

  .wrap{
    padding:0 8px
  }

  .hero{
    padding:9px 2px;
    gap:8px
  }

  .desc{
    display:none
  }

  .hero h1{
    font-size:25px
  }

  .progress{
    font-size:9px
  }

  .grid{
    gap:2px
  }

  .num{
    font-size:5px
  }

  .footer{
    padding:8px 2px 9px
  }

  .brand{
    font-size:12px
  }

  .brand span{
    font-size:8px
  }

  .actions{
    gap:5px
  }

  .actions a{
    padding:7px 11px;
    font-size:9px
  }

  .tile:hover .content{
    transform:scale(2.15) translateZ(0)
  }
}

/* =========================
   SHORT SCREENS
========================= */

@media(max-height:650px){

  .hero{
    padding:7px 2px
  }

  .footer{
    padding:6px 2px
  }

  .grid-area{
    padding:5px 0
  }
}

/* =========================
   REDUCE MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  .content{
    transition:none
  }

  .num{
    transition:none
  }

  .actions a{
    transition:none
  }
}

</style>
</head>

<body>

<div class="wrap">

<header class="hero">

  <h1>THE FIRST 100</h1>

  <div class="desc">
    For the first deserving reales of ROAD.
  </div>

  <div class="progress">
    REVEALED <span id="progress">100 / 100</span>
  </div>

</header>


<main class="grid-area">

  <div
    class="grid"
    id="grid"
  ></div>

</main>


<footer class="footer">

  <div class="brand">

    THE ROAD PROVIDES.

    <span>
      A new chance, for all.
    </span>

  </div>

  <div class="actions">

    <a
      class="x"
      href="https://x.com/theroadprovides"
      target="_blank"
      rel="noopener"
    >
      X / PROJECT
    </a>

    <a
      class="buy"
      href="https://pump.fun/coin/BgVkpGKLuiUGwj4GzaYyoKbWNMBUeem8rpuvEuRApump"
      target="_blank"
      rel="noopener"
    >
      BUY $ROAD
    </a>

  </div>

</footer>

</div>


<script>

const TOTAL = 100;

const API_SPOTS = "/api/spots";

const FORMATS = [
  'webp',
  'png',
  'jpg',
  'jpeg'
];

const grid = document.getElementById('grid');

let revealed = 0;


/* =========================
   SPOTS COUNTER
========================= */

async function updateProgress(){

  try{

    const response = await fetch(API_SPOTS,{
      method:"GET",
      cache:"no-store"
    });

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error("Unable to read spots.");
    }

    const remaining = Number(data.remaining);

    document.getElementById('progress').textContent =
      remaining + ' / ' + TOTAL;

  }catch(error){

    console.error("SPOTS:",error);

    document.getElementById('progress').textContent =
      '— / ' + TOTAL;

  }

}


/* =========================
   IMAGE LOADING
========================= */

function pad(n){
  return String(n).padStart(3,'0')
}


for(let i = 1; i <= TOTAL; i++){

  const n = pad(i);

  const tile = document.createElement('div');

  tile.className = 'tile';


  const content = document.createElement('div');

  content.className = 'content';


  const num = document.createElement('div');

  num.className = 'num';

  num.textContent = '#' + n;


  const empty = document.createElement('div');

  empty.className = 'empty';

  empty.textContent = '—';


  tile.append(
    content,
    num,
    empty
  );


  grid.appendChild(tile);


  let idx = 0;


  const probe = () => {

    if(idx >= FORMATS.length){

      return;

    }


    const src =
      `images/${n}.${FORMATS[idx++]}`;


    const img = new Image();


    img.onload = () => {

      content.style.backgroundImage =
        `url("${src}")`;

      empty.remove();

      revealed++;

    };


    img.onerror = probe;


    img.src = src;

  };


  probe();

}


/* =========================
   INITIAL COUNTER
========================= */

updateProgress();

</script>

</body>
</html>
