<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE ROAD PROVIDES — The First 100</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#000;
  --cell:#090909;
  --border:#2f3336;
  --cell-border:#1a1a1a;
  --ink:#e7e9ea;
  --dim:#71767b;
  --blue:#1d9bf0;
  --blue2:#1a8cd8;

  --display:'Anton',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:var(--ink);
  font-family:var(--body);
}

body{
  overflow:hidden;
  overscroll-behavior:none;
}

.wrap{
  width:min(1100px,100%);
  height:100svh;
  margin:auto;
  padding:0 16px;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  flex:0 0 auto;

  display:flex;
  align-items:flex-end;

  gap:18px;

  padding:13px 4px 11px;

  border-bottom:1px solid var(--border);
}

.hero h1{
  white-space:nowrap;

  font:
    clamp(24px,4vw,36px)/1
    var(--display);
}

.desc{
  max-width:460px;

  color:var(--dim);

  font-size:11.5px;
  line-height:1.35;
}

.progress{
  margin-left:auto;

  white-space:nowrap;

  color:var(--dim);

  font:
    10.5px
    var(--mono);
}

.progress span{
  color:var(--blue);
}


/* =====================================================
   GRID AREA
===================================================== */

.grid-area{
  flex:1;
  min-height:0;

  padding:7px 0;
}

.grid{
  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(10,1fr);

  grid-template-rows:
    repeat(10,1fr);

  gap:3px;
}


/* =====================================================
   TILE
===================================================== */

.tile{
  position:relative;

  overflow:visible;

  z-index:1;

  border:
    1px solid
    var(--cell-border);

  border-radius:4px;

  background:var(--cell);

  isolation:isolate;
}

.tile:hover{
  z-index:100;
}


/* =====================================================
   NEON GLOW
===================================================== */

.tile::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:70%;
  height:70%;

  transform:
    translate(-50%,-50%)
    scale(.7);

  border-radius:10px;

  background:
    rgba(29,155,240,.32);

  filter:
    blur(18px);

  opacity:0;

  pointer-events:none;

  z-index:-1;

  transition:
    opacity .25s ease,
    transform .25s cubic-bezier(.22,1,.36,1);
}

.tile:hover::after{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(2.15);
}


/* =====================================================
   IMAGE CONTENT
===================================================== */

.content{
  position:absolute;

  inset:0;

  border-radius:4px;

  background:
    #090909
    center/cover
    no-repeat;

  border:
    1px solid
    transparent;

  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    border-color .2s,
    box-shadow .25s,
    filter .2s;

  filter:brightness(.9);

  will-change:transform;

  transform:
    translateZ(0);

  backface-visibility:hidden;

  /*
   * Mantém a imagem estável durante
   * o carregamento e o zoom.
   */
  contain:paint;
}

.tile:hover .content{

  transform:
    scale(2.15)
    translateZ(0);

  border-color:
    var(--blue);

  box-shadow:
    0 16px 36px
      rgba(0,0,0,.65),

    0 0 0 1px
      rgba(29,155,240,.45),

    0 0 22px
      rgba(29,155,240,.25);

  filter:
    brightness(1.08);
}


/* =====================================================
   NUMBER
===================================================== */

.num{
  position:absolute;

  z-index:3;

  left:3px;
  bottom:2px;

  padding:
    1px 3px;

  border-radius:3px;

  background:
    rgba(0,0,0,.55);

  color:
    rgba(255,255,255,.72);

  pointer-events:none;

  font:
    6px
    var(--mono);

  transition:
    opacity .15s;
}

.tile:hover .num{
  opacity:0;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  color:#333;

  font:
    7px
    var(--mono);

  pointer-events:none;

  transition:
    opacity .15s;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
  flex:0 0 auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:
    9px 4px 11px;

  border-top:
    1px solid
    var(--border);
}

.brand{
  display:flex;

  flex-direction:column;

  justify-content:center;

  line-height:1;

  white-space:nowrap;

  font:
    14px
    var(--display);
}

.brand span{
  display:block;

  margin-top:3px;

  color:var(--dim);

  font:
    10px/1.1
    var(--body);
}

.actions{
  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:8px;

  margin-left:auto;
}

.actions a{
  display:flex;

  align-items:center;

  justify-content:center;

  height:34px;

  min-width:110px;

  padding:
    0 15px;

  border-radius:999px;

  white-space:nowrap;

  text-decoration:none;

  font-size:11px;
  font-weight:700;

  line-height:1;
}

.x{
  border:
    1px solid
    var(--border);

  color:var(--ink);
}

.buy{
  background:var(--blue);

  color:#fff;
}

.buy:hover{
  background:var(--blue2);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:640px){

  .wrap{
    padding:
      0 8px;
  }

  .hero{
    padding:
      9px 2px;

    gap:8px;
  }

  .hero h1{
    font-size:25px;
  }

  .desc{
    display:none;
  }

  .progress{
    font-size:9px;
  }

  .grid{
    gap:2px;
  }

  .num{
    font-size:5px;
  }

  .footer{
    padding:
      7px 2px 9px;

    gap:10px;
  }

  .brand{
    font-size:12px;
  }

  .brand span{
    font-size:8px;
    margin-top:2px;
  }

  .actions{
    gap:5px;
  }

  .actions a{
    height:30px;

    min-width:auto;

    padding:
      0 10px;

    font-size:9px;
  }

}


/* =====================================================
   SHORT SCREENS
===================================================== */

@media(max-height:650px){

  .hero{
    padding:
      7px 2px;
  }

  .grid-area{
    padding:
      5px 0;
  }

  .footer{
    padding:
      6px 2px;
  }

}

</style>
</head>


<body>

<div class="wrap">


<header class="hero">

  <h1>
    THE FIRST 100
  </h1>

  <div class="desc">
    Every road revealed here belongs to someone who walked early.
  </div>

  <div class="progress">
    REVEALED
    <span id="progress">
      0 / 100
    </span>
  </div>

</header>


<main class="grid-area">

  <div
    class="grid"
    id="grid"
  ></div>

</main>


<footer class="footer">

  <div class="brand">

    THE ROAD PROVIDES.

    <span>
      A new chance, for all.
    </span>

  </div>


  <div class="actions">

    <a
      class="x"
      href="https://x.com/theroadprovides"
      target="_blank"
      rel="noopener noreferrer"
    >
      X / PROJECT
    </a>


    <a
      class="buy"
      href="https://pump.fun/coin/BgVkpGKLuiUGwj4GzaYyoKbWNMBUeem8rpuvEuRApump"
      target="_blank"
      rel="noopener noreferrer"
    >
      BUY $ROAD
    </a>

  </div>

</footer>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL = 100;

const IMAGE_FOLDER =
  "images/";

const API =
  "/.netlify/functions/spots";

/*
 * Número de imagens carregadas
 * simultaneamente.
 *
 * Um valor moderado evita travar
 * celular e navegador.
 */
const LOAD_CONCURRENCY = 12;


/* =====================================================
   ELEMENTS
===================================================== */

const grid =
  document.getElementById(
    "grid"
  );

const progress =
  document.getElementById(
    "progress"
  );


/* =====================================================
   LOAD CLAIM COUNT
===================================================== */

async function loadClaims(){

  try{

    const response =
      await fetch(
        API,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "API request failed"
      );

    }

    const data =
      await response.json();

    if(
      data &&
      typeof data.claimed ===
        "number"
    ){

      const claimed =
        Math.max(
          0,
          Math.min(
            TOTAL,
            data.claimed
          )
        );

      progress.textContent =
        claimed +
        " / " +
        TOTAL;

    }

  }catch(error){

    console.warn(
      "Unable to load claims:",
      error
    );

  }

}


/* =====================================================
   IMAGE LOADER
===================================================== */

function loadImage(tile){

  return new Promise(
    function(resolve){

      if(
        tile.dataset.loaded ===
          "true"
      ){

        resolve(true);

        return;

      }


      if(
        tile.dataset.loading ===
          "true"
      ){

        resolve(false);

        return;

      }


      tile.dataset.loading =
        "true";


      const id =
        tile.dataset.id;


      const content =
        tile.querySelector(
          ".content"
        );


      const empty =
        tile.querySelector(
          ".empty"
        );


      const src =
        IMAGE_FOLDER +
        id +
        ".png";


      const image =
        new Image();


      image.decoding =
        "async";


      image.onload =
        function(){

          content.style.backgroundImage =
            'url("' +
            src +
            '")';


          tile.dataset.loaded =
            "true";


          tile.dataset.loading =
            "false";


          if(empty){

            empty.style.opacity =
              "0";

            setTimeout(
              function(){

                if(
                  empty.parentNode
                ){

                  empty.remove();

                }

              },
              150
            );

          }


          resolve(true);

        };


      image.onerror =
        function(){

          tile.dataset.loading =
            "error";


          resolve(false);

        };


      /*
       * Mantém a referência da imagem
       * disponível até o onload.
       */
      image.src =
        src;

    }
  );

}


/* =====================================================
   CREATE TILE
===================================================== */

function createTile(number){

  const id =
    String(number)
      .padStart(
        3,
        "0"
      );


  const tile =
    document.createElement(
      "div"
    );


  tile.className =
    "tile";


  tile.dataset.id =
    id;


  const content =
    document.createElement(
      "div"
    );


  content.className =
    "content";


  const num =
    document.createElement(
      "div"
    );


  num.className =
    "num";


  num.textContent =
    "#" +
    id;


  const empty =
    document.createElement(
      "div"
    );


  empty.className =
    "empty";


  empty.textContent =
    "—";


  tile.append(
    content,
    num,
    empty
  );


  grid.appendChild(
    tile
  );


  return tile;

}


/* =====================================================
   BUILD GRID
===================================================== */

const tiles = [];


for(
  let i = 1;
  i <= TOTAL;
  i++
){

  tiles.push(
    createTile(i)
  );

}


/* =====================================================
   FAST IMAGE PRELOAD
===================================================== */

/*
 * Carrega as imagens em grupos paralelos.
 *
 * Diferentemente do IntersectionObserver,
 * isso funciona muito melhor aqui porque
 * a galeria inteira já está dentro da viewport.
 */

async function preloadAllImages(){

  let index = 0;


  async function worker(){

    while(
      true
    ){

      const current =
        index++;


      if(
        current >=
        tiles.length
      ){

        return;

      }


      await loadImage(
        tiles[current]
      );

    }

  }


  const workers = [];


  const workerCount =
    Math.min(
      LOAD_CONCURRENCY,
      tiles.length
    );


  for(
    let i = 0;
    i < workerCount;
    i++
  ){

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadClaims();


/*
 * Inicia o carregamento das imagens
 * imediatamente após montar a grade.
 */
preloadAllImages();


/* =====================================================
   REFRESH COUNTER
===================================================== */

setInterval(
  loadClaims,
  30000
);

</script>

</body>
</html>
